<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#2d4a2d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a1a"/>
      <stop offset="100%" stop-color="#1a2a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#88ffaa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#88ffaa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="240" cy="45" r="22" fill="#e8e0c0" opacity="0.9"/>
  <circle cx="250" cy="40" r="18" fill="#2a3a2a"/>

  <!-- Stars -->
  <circle cx="30" cy="25" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="70" cy="15" r="1" fill="white" opacity="0.7"/>
  <circle cx="120" cy="30" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="170" cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="55" cy="50" r="1" fill="white" opacity="0.7"/>
  <circle cx="200" cy="35" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="265" cy="20" r="1" fill="white" opacity="0.7"/>

  <!-- Background trees (distant) -->
  <rect x="0" y="130" width="18" height="100" fill="#1a2e1a"/>
  <polygon points="9,60 -10,140 28,140" fill="#1e3a1e"/>
  <polygon points="9,80 -8,140 26,140" fill="#223e22"/>

  <rect x="25" y="145" width="14" height="85" fill="#1a2e1a"/>
  <polygon points="32,75 14,155 50,155" fill="#1e3a1e"/>
  <polygon points="32,95 16,155 48,155" fill="#223e22"/>

  <rect x="260" y="120" width="18" height="110" fill="#1a2e1a"/>
  <polygon points="269,50 249,130 289,130" fill="#1e3a1e"/>
  <polygon points="269,70 251,130 287,130" fill="#223e22"/>

  <rect x="278" y="135" width="22" height="100" fill="#1a2e1a"/>
  <polygon points="289,60 268,145 310,145" fill="#1e3a1e"/>
  <polygon points="289,82 270,145 308,145" fill="#223e22"/>

  <!-- Mid trees -->
  <rect x="42" y="160" width="22" height="140" fill="#152815"/>
  <polygon points="53,80 25,175 81,175" fill="#1a341a"/>
  <polygon points="53,105 28,175 78,175" fill="#1e3c1e"/>
  <polygon points="53,130 31,175 75,175" fill="#224022"/>

  <rect x="235" y="155" width="22" height="145" fill="#152815"/>
  <polygon points="246,75 218,170 274,170" fill="#1a341a"/>
  <polygon points="246,100 221,170 271,170" fill="#1e3c1e"/>
  <polygon points="246,125 224,170 268,170" fill="#224022"/>

  <!-- Foreground large trees -->
  <rect x="15" y="185" width="28" height="115" fill="#0f1e0f"/>
  <polygon points="29,95 -5,200 63,200" fill="#162816"/>
  <polygon points="29,120 -2,200 60,200" fill="#1a2e1a"/>
  <polygon points="29,148" fill="#1e3418"/>

  <rect x="255" y="180" width="30" height="120" fill="#0f1e0f"/>
  <polygon points="270,90 236,195 304,195" fill="#162816"/>
  <polygon points="270,115 239,195 301,195" fill="#1a2e1a"/>

  <!-- Ground -->
  <ellipse cx="150" cy="285" rx="180" ry="40" fill="url(#ground)"/>
  <rect x="0" y="260" width="300" height="40" fill="#1a2a0a"/>

  <!-- Grass tufts -->
  <path d="M60,260 Q63,248 66,260" stroke="#3a6020" stroke-width="2" fill="none"/>
  <path d="M65,262 Q68,250 71,262" stroke="#2e5018" stroke-width="2" fill="none"/>
  <path d="M100,258 Q103,246 106,258" stroke="#3a6020" stroke-width="2" fill="none"/>
  <path d="M195,260 Q198,248 201,260" stroke="#3a6020" stroke-width="2" fill="none"/>
  <path d="M225,258 Q228,246 231,258" stroke="#3a6020" stroke-width="2" fill="none"/>

  <!-- Elf glow -->
  <circle cx="150" cy="195" r="55" fill="url(#glow)"/>

  <!-- Elf body -->
  <!-- Legs -->
  <rect x="136" y="232" width="12" height="30" rx="4" fill="#4a6e30"/>
  <rect x="152" y="232" width="12" height="30" rx="4" fill="#4a6e30"/>
  <!-- Boots -->
  <ellipse cx="142" cy="263" rx="10" ry="6" fill="#3a2810"/>
  <ellipse cx="158" cy="263" rx="10" ry="6" fill="#3a2810"/>
  <!-- Boot tips (pointy elf boots) -->
  <polygon points="134,260 148,260 130,268" fill="#3a2810"/>
  <polygon points="150,260 164,260 146,268" fill="#3a2810"/>

  <!-- Tunic -->
  <path d="M128,195 Q130,240 142,244 L158,244 Q170,240 172,195 Z" fill="#2e6e2e"/>
  <!-- Belt -->
  <rect x="130" y="220" width="40" height="6" rx="2" fill="#8b5e2a"/>
  <rect x="147" y="219" width="6" height="8" rx="1" fill="#c8922a"/>

  <!-- Arms -->
  <path d="M130,200 Q112,210 108,225" stroke="#5a7e40" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M170,200 Q188,210 192,225" stroke="#5a7e40" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Hands -->
  <circle cx="108" cy="226" r="7" fill="#d4a87a"/>
  <circle cx="192" cy="226" r="7" fill="#d4a87a"/>

  <!-- Neck -->
  <rect x="143" y="175" width="14" height="14" rx="4" fill="#d4a87a"/>

  <!-- Head -->
  <ellipse cx="150" cy="163" rx="24" ry="20" fill="#d4a87a"/>

  <!-- Ears (pointy elf ears) -->
  <polygon points="126,158 118,148 130,165" fill="#d4a87a"/>
  <polygon points="174,158 182,148 170,165" fill="#d4a87a"/>
  <line x1="118" y1="148" x2="128" y2="160" stroke="#c49a6a" stroke-width="1"/>
  <line x1="182" y1="148" x2="172" y2="160" stroke="#c49a6a" stroke-width="1"/>

  <!-- Eyes -->
  <ellipse cx="141" cy="160" rx="5" ry="5.5" fill="#1a2a1a"/>
  <ellipse cx="159" cy="160" rx="5" ry="5.5" fill="#1a2a1a"/>
  <!-- Eye shine -->
  <circle cx="143" cy="158" r="1.5" fill="#88ddaa"/>
  <circle cx="161" cy="158" r="1.5" fill="#88ddaa"/>
  <!-- Eyebrows -->
  <path d="M137,153 Q141,150 145,153" stroke="#5a3a20" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M155,153 Q159,150 163,153" stroke="#5a3a20" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="150" cy="166" rx="3" ry="2.5" fill="#c49060"/>

  <!-- Smile -->
  <path d="M143,172 Q150,178 157,172" stroke="#8a5040" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Hair -->
  <path d="M126,160 Q128,135 150,130 Q172,135 174,160 Q168,148 150,145 Q132,148 126,160 Z" fill="#2a5a20"/>

  <!-- Hat (tall pointed elf hat) -->
  <polygon points="150,95 130,148 170,148" fill="#2e6e2e"/>
  <rect x="127" y="145" width="46" height="8" rx="3" fill="#3a8a3a"/>
  <!-- Hat star -->
  <polygon points="150,103 152,110 159,110 153,114 155,121 150,117 145,121 147,114 141,110 148,110" fill="#e8d840" opacity="0.9"/>

  <!-- Fireflies / magic sparkles -->
  <circle cx="95" cy="175" r="2.5" fill="#ccff88" opacity="0.9"/>
  <circle cx="88" cy="190" r="1.5" fill="#aaffcc" opacity="0.7"/>
  <circle cx="210" cy="180" r="2" fill="#ccff88" opacity="0.8"/>
  <circle cx="218" cy="165" r="1.5" fill="#aaffcc" opacity="0.6"/>
  <circle cx="105" cy="210" r="1.5" fill="#ccff88" opacity="0.6"/>
  <circle cx="198" cy="200" r="2" fill="#ccff88" opacity="0.7"/>

  <!-- Ground mushrooms -->
  <rect x="82" y="254" width="5" height="10" fill="#d4c890"/>
  <ellipse cx="84" cy="254" rx="9" ry="5" fill="#cc4444"/>
  <circle cx="81" cy="252" r="1" fill="white"/>
  <circle cx="87" cy="251" r="1.2" fill="white"/>
  <circle cx="84" cy="254" r="0.8" fill="white"/>

  <rect x="210" y="256" width="5" height="8" fill="#d4c890"/>
  <ellipse cx="212" cy="256" rx="8" ry="4.5" fill="#cc7722"/>
  <circle cx="209" cy="254" r="1" fill="#ffcc88" opacity="0.7"/>
  <circle cx="215" cy="253" r="1.2" fill="#ffcc88" opacity="0.7"/>
</svg>
