baseURL = 'https://zzziiyy.github.io/Ziy/'
languageCode = 'en-us'
defaultContentLanguage = 'en'
title = 'Beyond World'
theme = 'anatole'
summaryLength = 35
enableRobotsTXT = true
enableEmoji = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

[params]
  contentratio = 0.72
  title = "Beyond World"
  author = "Ziy's Garden"
  description = "Thoughts and explorations in human learning."
  profilePicture = "images/soul_avatar.png"
  keywords = "machine learning, deep learning, data science, python, neural networks"
  favicon = "favicons/"
  customCss = []
  customJs = []
  mainSections = ["post"]
  mainSectionsTitle = "Recent Writing"
  doNotLoadAnimations = false
  readMore = true
  reversepagetitle = true
  singleDateFormat = "Jan 2, 2006"
  indexDateFormat = "Jan 2006"
  listDateFormat = "Jan 2, 2006"
  disableTitleCapitalization = true
  disableArchiveTitleStyling = true
  contactFormAction = "https://formspree.io/f/mbdekkao"

  [params.math]
    enable = true
    use = "katex"

  [params.mermaid]
    enable = true


[languages]
  [languages.en]
    languageName = "English"
    weight = 1

  [languages.zh-cn]
    languageName = "中文"
    weight = 2
    languageCode = 'zh-CN'

    [languages.zh-cn.params]
      description = "关于机器学习的思考与探索。"
      mainSectionsTitle = "近期文章"

    [[languages.zh-cn.menu.main]]
      name = "关于"
      identifier = "about"
      url = "/zh-cn/about/"
      weight = 10

    [[languages.zh-cn.menu.main]]
      name = "项目"
      identifier = "projects"
      url = "/zh-cn/portfolio/"
      weight = 20

    [[languages.zh-cn.menu.main]]
      name = "实验"
      identifier = "experiments"
      url = "/zh-cn/experiments/"
      weight = 30

    [[languages.zh-cn.menu.main]]
      name = "博客"
      identifier = "blog"
      url = "/zh-cn/post/"
      weight = 40

    [[languages.zh-cn.menu.main]]
      name = "联系"
      identifier = "contact"
      url = "/zh-cn/contact/"
      weight = 50

[[menu.main]]
  name = "About"
  identifier = "about"
  url = "/about/"
  weight = 10

