baseURL = 'https://zzziiyy.github.io/'
languageCode = 'en-us'
title = 'Beyond World'
theme = 'anatole'
summaryLength = 35
enableRobotsTXT = true
enableEmoji = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

[params]
  contentratio = 0.72
  title = "Beyond World"
  author = "Ziy"
  description = "Thoughts and explorations in human learning."
  profilePicture = "images/profile.jpg"
  keywords = "machine learning, deep learning, data science, python, neural networks"
  favicon = "favicons/"
  customCss = []
  customJs = []
  mainSections = ["post"]
  mainSectionsTitle = "Recent Writing"
  doNotLoadAnimations = false
  readMore = true
  reversepagetitle = true
  singleDateFormat = "Jan 2, 2006"
  indexDateFormat = "Jan 2006"
  listDateFormat = "Jan 2, 2006"
  disableTitleCapitalization = true
  disableArchiveTitleStyling = true

  [params.math]
    enable = true
    use = "katex"

  [params.mermaid]
    enable = true

  [[params.socialIcons]]
  icon = "fa-brands fa-github"
  title = "GitHub"
  url = "https://github.com/zzziiyy"

  [[params.socialIcons]]
  icon = "fa-brands fa-linkedin"
  title = "LinkedIn"
  url = "https://www.linkedin.com/"

  [[params.socialIcons]]
  icon = "fa-solid fa-envelope"
  title = "Email"
  url = "mailto:zzyzzoe@gmail.com"

